<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreadSoft | WiFi Provisioning</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --dark: #2f2f2f;
            --light: #f7f7f7;
            --accent: #ffe66d;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #3d3d3d 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light);
            overflow: hidden;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-box {
            margin-bottom: 1.5rem;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 12px;
            display: inline-block;
            position: relative;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .logo::after {
            content: 'B';
            color: white;
            font-weight: bold;
            font-size: 32px;
            line-height: 60px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        p {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 2rem;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            color: var(--secondary);
            text-transform: uppercase;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--secondary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.2);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, var(--primary), #ff8787);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #666;
        }

        /* Success State */
        .success-content {
            display: none;
        }

        .success .form-content { display: none; }
        .success .success-content { display: block; }
        
        .success-icon {
            font-size: 3rem;
            color: var(--secondary);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="logo-box">
            <div class="logo"></div>
        </div>
        
        <div class="form-content">
            <h1>BreadSoft Bulletin</h1>
            <p>Setup WiFi to start displaying images</p>
            
            <form method="post" action="/submit">
                <div class="input-group">
                    <label>Network SSID</label>
                    <input type="text" name="ssid" placeholder="Enter WiFi Name" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter Password">
                </div>
                
                <button type="submit" class="btn">Connect Device</button>
            </form>
        </div>

        <div class="success-content">
            <div class="success-icon">✓</div>
            <h1>Configuration Saved</h1>
            <p>The device is now attempting to connect. You can close this window.</p>
            <div class="footer">Waiting for device handshake...</div>
        </div>

        <div class="footer">
            BreadSoft E-Paper System v1.7
        </div>
    </div>

    <script>
        // Check for success param in URL
        if (window.location.search.includes('success=1')) {
            document.getElementById('mainContainer').classList.add('success');
        }
    </script>
</body>
</html>
